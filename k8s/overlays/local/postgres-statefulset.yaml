apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        # Exigido pelo perfil PSS `restricted` do namespace. 999 é o uid do
        # usuário postgres na imagem oficial; fsGroup faz o PVC nascer com o
        # grupo certo.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15.19-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Subdiretório, não a raiz do mount: o initdb recusa um diretório
            # que já contenha lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: techchallenge-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # readOnlyRootFilesystem exige que os diretórios que o postgres
            # escreve fora do PVC sejam emptyDir.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        # storageClassName OMITIDO de propósito: usa a StorageClass default de
        # cada cluster (docker-desktop=hostpath, kind=standard, EKS=gp2/gp3).
        # Fixar o nome quebraria a portabilidade.
        resources:
          requests:
            storage: 2Gi
