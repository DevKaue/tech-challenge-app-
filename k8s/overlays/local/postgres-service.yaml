apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  # Headless: dá o DNS estável postgres.techchallenge.svc.cluster.local usado
  # no DATABASE_URL. Não expõe nada fora do cluster.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
