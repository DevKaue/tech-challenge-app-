services:
  db:
    image: postgres:15.19-alpine
    container_name: techchallenge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copie .env.example para .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copie .env.example para .env}
      POSTGRES_DB: ${POSTGRES_DB:?copie .env.example para .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: techchallenge_api
    #user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    command: >
      sh -c "npm run prisma:generate &&
      npm run prisma:migrate:deploy &&
      (npm run prisma:seed || echo '[WARN] seed pulado — siga o boot') &&
      DATABASE_URL=$${DATABASE_URL_TEST} npx prisma migrate deploy &&
      npm run start:dev"
    ports:
      - '3000:3000'
      # Debugger do Node: `npm run start:debug` já existia, mas a porta nunca
      # era publicada — o debugger era inalcançável de fora do container.
      # Anexe o VS Code / chrome://inspect em localhost:9229.
      - '127.0.0.1:9229:9229'
    # Interpolação a partir do .env, com `:?` para FALHAR ALTO se ele não existir.
    # Sem o `:?`, variável ausente vira string vazia: o container sobe e morre
    # com erro de conexão, sem dizer que faltou copiar o .env.
    environment:
      - DATABASE_URL=${DATABASE_URL:?copie .env.example para .env}
      - JWT_SECRET=${JWT_SECRET:?copie .env.example para .env}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?copie .env.example para .env}
      - PASSWORD_SALT=${PASSWORD_SALT:?copie .env.example para .env}
      # Usado só pelo `migrate deploy` do banco de testes, na linha do command.
      - DATABASE_URL_TEST=${DATABASE_URL_TEST:?copie .env.example para .env}
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - ./src:/usr/src/app/src
      - ./prisma:/usr/src/app/prisma
      - ./test:/usr/src/app/test
      - ./coverage:/usr/src/app/coverage
      - ./coverage-integration:/usr/src/app/coverage-integration
      - ./coverage-e2e:/usr/src/app/coverage-e2e
      - ./combined-coverage:/usr/src/app/combined-coverage
      - ./scripts:/usr/src/app/scripts
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./tsconfig.build.json:/usr/src/app/tsconfig.build.json
      - ./nest-cli.json:/usr/src/app/nest-cli.json
      - ./prisma.config.ts:/usr/src/app/prisma.config.ts
      - ./eslint.config.mjs:/usr/src/app/eslint.config.mjs
      - ./package.json:/usr/src/app/package.json
      - ./package-lock.json:/usr/src/app/package-lock.json
      - /usr/src/app/node_modules

  sonar_db:
    image: postgres:15.19-alpine
    container_name: techchallenge_sonar_db
    profiles:
      - quality
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: techchallenge_sonarqube
    profiles:
      - quality
    restart: unless-stopped
    depends_on:
      sonar_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/system/status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 3G }
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    container_name: techchallenge_sonar_scanner
    profiles:
      - quality
    depends_on:
      sonarqube:
        condition: service_healthy
    volumes:
      - ./:/usr/src/app
    working_dir: /usr/src/app
    environment:
      - SONAR_SCANNER_OPTS=-Xmx2g
      - SONAR_TOKEN=${SONAR_TOKEN:-}
    # platform: linux/amd64
    command: >
      sh -c "
      until curl -sf http://sonarqube:9000/api/system/status | grep -q '\"status\":\"UP\"'; do
        echo 'Waiting for SonarQube...'; sleep 5;
      done &&
      sonar-scanner
      -Dsonar.host.url=http://sonarqube:9000
      -Dsonar.token=$${SONAR_TOKEN:?defina SONAR_TOKEN no .env}
      "

volumes:
  postgres_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: